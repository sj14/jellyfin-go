---
name: Go
on:
  push:
    branches:
      - main
    paths:
      - go.mod
      - go.sum
      - "**.go"
      - ".github/workflows/go.yaml"
  pull_request:
    paths:
      - go.mod
      - go.sum
      - "**.go"
      - ".github/workflows/go.yaml"
jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build Example
        run: go build example/main.go
